# Legacy Nginx Cryptographic Configuration
# VULNERABILITY: Enabling deprecated SSL/TLS protocols and broken cipher suites

server {
    listen 443 ssl;
    server_name vault.fintech-internal.corp;

    ssl_certificate /etc/ssl/certs/legacy_gateway.crt;
    ssl_certificate_key /etc/ssl/private/legacy_gateway.key;

    # Vulnerability: Deprecated TLSv1.0 and TLSv1.1 (NIST SP 800-52r2 non-compliant)
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # Vulnerability: Weak cipher suites containing RC4, 3DES, and CBC-mode ciphers
    ssl_ciphers 'RC4-MD5:RC4-SHA:DES-CBC3-SHA:AES128-SHA:AES256-SHA:HIGH:!aNULL:!kEDH';
    ssl_prefer_server_ciphers on;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
    }
}
