services:
  target1:
    build: ./target1
    container_name: ctf-token-target1
    networks:
      dmz_net_ts:
        ipv4_address: 172.29.0.10
      internal_net_ts:
        ipv4_address: 172.30.0.10
    ports:
      - "8086:8086"
    restart: unless-stopped

  target2:
    build: ./target2
    container_name: ctf-token-target2
    networks:
      internal_net_ts:
        ipv4_address: 172.30.0.20
    restart: unless-stopped

networks:
  dmz_net_ts:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
  internal_net_ts:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
